<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資料・活動記録 - メンバー専用ポータル</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>資料・活動記録</h1>
        <p>過去のプロジェクト資料や、活動記録のアーカイブです</p>
    </header>

    <main>
        <div class="content-wrapper">
            <div class="back-link">
                <a href="index.html">← トップページに戻る</a>
            </div>

            <!-- ドライブの運用ルールなどの案内 -->
            <div class="drive-note">
                <strong>💡 資料の閲覧</strong>
                <p>該当する年度やプロジェクトのフォルダをクリックして閲覧してください。</p>
            </div>

            <!-- ▼▼ Googleドライブ埋め込みエリア ▼▼ -->
            <h2 class="section-title">📂 共有ドライブ一覧</h2>
            
            <div class="google-drive-wrapper">
                <!-- ここにGoogleドライブのiframeコードを貼り付けます -->
                <iframe src="https://drive.google.com/embeddedfolderview?id=1NOw6O_0CAxCqNSeFvDcewXDb_sNtJ3eL#grid" width="100%" height="500" frameborder="0"></iframe>
            </div>
            
            <div class="calendar-note">
                <p>※うまく表示されない場合は、お使いのGoogleアカウントでログインしているか確認してください。</p>
            </div>
            <!-- ▲▲ Googleドライブ埋め込みエリア ▲▲ -->

        </div>
    </main>

    <footer>
        <p>&copy; 2026 メンバー専用ポータル. All rights reserved.</p>
    </footer>
</body>
</html>
